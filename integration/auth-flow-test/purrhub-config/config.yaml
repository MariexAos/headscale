# Auth-flow integration test — direct client→purrhub (no APISIX/nginx).
# Server URL uses purrhub's static IP so the tailscale client treats it as an
# IP literal and skips the HTTPS-on-443 fallback for non-IP login servers.
server_url: http://172.30.1.10:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: true

noise:
  private_key_path: /var/lib/purrhub/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    enabled: true
    region_id: 999
    region_code: "pub"
    region_name: "Public DERP"
    verify_clients: false
    stun_listen_addr: ""
    private_key_path: /var/lib/purrhub/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  disguise:
    control_upgrade_path: "/api/connect"
    control_upgrade_value: "h2c-protocol"
    control_handshake_header: "X-Session-Init"
    derp_url_path: "/relay"
    derp_upgrade_header: "websocket"
    derp_fast_start_header: "X-Fast-Start"
    derp_ws_subprotocol: "relay-v1"
    derp_magic: "SYNC🔑"
    early_payload_magic: "\xff\xff\xffSY"

database:
  type: sqlite
  sqlite:
    path: /var/lib/purrhub/db.sqlite
    write_ahead_log: true

disable_check_updates: true
randomize_client_port: false

log:
  level: debug
  format: text

dns:
  magic_dns: true
  base_domain: mesh.lan
  override_local_dns: true
  nameservers:
    global:
      - 8.8.8.8

policy:
  mode: file
  path: ""

unix_socket: /var/run/purrhub/purrhub.sock
unix_socket_permission: "0770"

logtail:
  enabled: false
