# Serial chain topology:
#   purr-node1 → nginx → APISIX → purrhub(DERP999) → APISIX → purr-node2 → node3
#
#   nginx 只能访问 APISIX（不能直连 purrhub）
#   APISIX 是唯一能访问 purrhub 的网关
#
#   net-node1            net-edge             net-server          net-node2         net-internal
#   172.28.2.0/24        172.28.5.0/24        172.28.1.0/24       172.28.3.0/24     172.28.4.0/24
#   ┌────────────┐       ┌──────────┐         ┌───────────┐       ┌────────────┐    ┌──────────┐
#   │ purr-node1 │──────→│  nginx   │────────→│  APISIX   │──────→│ purr-node2 │───→│  node3   │
#   └────────────┘       └──────────┘         │     ↓      │      └────────────┘    └──────────┘
#                                             │  purrhub   │
#                                             │ DERP 999   │
#                                             └───────────┘

services:
  # purrhub — control plane (renamed headscale fork)
  purrhub:
    build:
      context: ../../..
      dockerfile: purrhub/integration/apisix-test/Dockerfile.purrhub
    volumes:
      - ./purrhub-config/config.yaml:/etc/purrhub/config.yaml:ro
      - purrhub-data:/var/lib/purrhub
      - purrhub-run:/var/run/purrhub
    command: ["/bin/bash", "-c", "mkdir -p /var/lib/purrhub /var/run/purrhub && /usr/local/bin/purrhub serve -c /etc/purrhub/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      # purrhub 只在 net-server,只有 APISIX 能访问
      net-server: { aliases: [purrhub] }
    restart: unless-stopped

  # APISIX — 唯一能访问 purrhub 的 API 网关
  # 在 net-server（连 purrhub） + net-edge（让 nginx 转发过来） + net-node2（让 purr-node2 直连）
  apisix:
    image: apache/apisix:3.11.0-debian
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      purrhub: { condition: service_healthy }
    networks:
      net-server: { aliases: [apisix-server] }
      net-edge: { aliases: [apisix-backend] }     # nginx 通过此别名转发
      net-node2: { aliases: [gateway] }            # purr-node2 直连
    restart: unless-stopped

  # nginx — 前置入口，只能访问 APISIX（不能直连 purrhub）
  # 在 net-node1（接受 purr-node1） + net-edge（转发给 APISIX）
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      apisix: { condition: service_started }
    networks:
      net-node1: { aliases: [gateway] }            # purr-node1 通过此别名连接
      net-edge: { aliases: [nginx-edge] }          # nginx 到 APISIX 的专用网络
      # 注意：nginx 不在 net-server，不能直连 purrhub
    restart: unless-stopped

  # purr-node1 — 外网开发者，只能到 nginx
  purr-node1:
    build:
      context: ../../../purr
      dockerfile: ../purrhub/integration/apisix-test/Dockerfile.purr
    volumes:
      - purr-node1-state:/var/lib/purr
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    depends_on:
      nginx: { condition: service_started }
    networks:
      net-node1: { aliases: [purr-node1] }
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dev/net /var/run/purr; [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200
        # Purr-branded paths so `ls /var/run` shows /var/run/purr/purrd.sock,
        # not /var/run/tailscale/tailscaled.sock.
        purrd --state=/var/lib/purr/purrd.state --socket=/var/run/purr/purrd.sock &
        sleep 3; tail -f /dev/null
    restart: unless-stopped

  # purr-node2 — 内网子网路由器，直连 APISIX + 内网
  purr-node2:
    build:
      context: ../../../purr
      dockerfile: ../purrhub/integration/apisix-test/Dockerfile.purr
    volumes:
      - purr-node2-state:/var/lib/purr
    cap_add: [NET_ADMIN, SYS_MODULE]
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    depends_on:
      apisix: { condition: service_started }
    networks:
      net-node2: { aliases: [purr-node2] }
      net-internal: { ipv4_address: 172.28.4.2, aliases: [purr-node2-internal] }
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /dev/net /var/run/purr; [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200
        # Purr-branded paths so `ls /var/run` shows /var/run/purr/purrd.sock,
        # not /var/run/tailscale/tailscaled.sock.
        purrd --state=/var/lib/purr/purrd.state --socket=/var/run/purr/purrd.sock &
        sleep 3; tail -f /dev/null
    restart: unless-stopped

  # node3 — 纯内网 Git
  node3:
    image: alpine:3.22
    cap_add: [NET_ADMIN]
    networks:
      net-internal: { ipv4_address: 172.28.4.10, aliases: [git-server] }
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache git openssh-server python3
        ssh-keygen -A
        adduser -D -s /bin/sh gituser
        echo "gituser:git123" | chpasswd
        mkdir -p /home/gituser/repo.git
        cd /home/gituser/repo.git && git init --bare
        chown -R gituser:gituser /home/gituser
        echo "PasswordAuthentication yes" >> /etc/ssh/sshd_config
        /usr/sbin/sshd
        mkdir -p /tmp/www
        echo '{"service":"internal-api","host":"node3"}' > /tmp/www/index.html
        cd /tmp/www && python3 -m http.server 8080 --bind 0.0.0.0
    restart: unless-stopped

volumes:
  purrhub-data:
  purrhub-run:
  purr-node1-state:
  purr-node2-state:

networks:
  net-server:
    driver: bridge
    ipam: { config: [{ subnet: "172.28.1.0/24" }] }
  net-edge:
    driver: bridge
    ipam: { config: [{ subnet: "172.28.5.0/24" }] }
  net-node1:
    driver: bridge
    ipam: { config: [{ subnet: "172.28.2.0/24" }] }
  net-node2:
    driver: bridge
    ipam: { config: [{ subnet: "172.28.3.0/24" }] }
  net-internal:
    driver: bridge
    ipam: { config: [{ subnet: "172.28.4.0/24" }] }
